name: Create and publish multi-arch Docker images

on:
  push:
    branches:
      - 'fix/**'
      - 'dev'
      - 'test-**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  # Sem namespace fixo: o GITHUB_TOKEN só tem `packages: write` no owner do
  # próprio repositório. Fixar `ticketz-oss` fazia todo push deste fork falhar
  # com "denied: permission_denied: The requested installation does not exist".
  IMAGE_BACKEND_NAME: ticketz-backend
  IMAGE_FRONTEND_NAME: ticketz-frontend

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolver namespace do registry
        id: registry
        run: |
          # GHCR exige o nome da imagem em minúsculas; o owner pode ter maiúsculas.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get git info and setup version files
        run: |
          cat <<EOT > backend/src/gitinfo.ts
          export const GitInfo = {
              commitHash: "$(git rev-parse --short=7 HEAD)",
              commitTimestamp: "$(date -u -d "$(git log -1 --format=%cI)" +'%Y-%m-%dT%H:%M:%SZ')",
              branchName: "$(git rev-parse --abbrev-ref HEAD)",
              tagName: "$(git describe --tags --abbrev=0 2>/dev/null)",
              buildTimestamp: "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          };
          EOT
          cat <<EOT > frontend/public/gitinfo.json
          {
              "commitHash": "$(git rev-parse --short=7 HEAD)",
              "commitTimestamp": "$(date -u -d "$(git log -1 --format=%cI)" +'%Y-%m-%dT%H:%M:%SZ')",
              "branchName": "$(git rev-parse --abbrev-ref HEAD)",
              "tagName": "$(git describe --tags --abbrev=0 2>/dev/null)",
              "buildTimestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta Backend
        id: metabackend
        uses: docker/metadata-action@v3
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/${{ env.IMAGE_BACKEND_NAME }}
          labels: |
            org.opencontainers.image.title=ticketz-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Docker meta Frontend
        id: metafrontend
        uses: docker/metadata-action@v3
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/${{ env.IMAGE_FRONTEND_NAME }}
          labels: |
            org.opencontainers.image.title=ticketz-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push backend Docker image
        id: backend
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metabackend.outputs.tags }}
          labels: ${{ steps.metabackend.outputs.labels }}
          build-args: TICKETZ_REGISTRY_URL=${{secrets.TICKETZ_REGISTRY_URL}}

      - name: Build and push frontend Docker image
        id: frontend
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metafrontend.outputs.tags }}
          labels: ${{ steps.metafrontend.outputs.labels }}
